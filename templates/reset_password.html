{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="width: 100%; max-width: 500px; margin: 0 auto;">
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 20px; padding: 25px; margin-bottom: 25px; color: white;">
        <h2>🔐 Set New Password</h2>
        <p>Choose a strong password.</p>
    </div>
    <div style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label>New Password</label>
                <input type="password" name="new_password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px;">
                <small>At least 8 characters with uppercase, lowercase, a number, and a special character.</small>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Confirm New Password</label>
                <input type="password" name="confirm_password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px;">
            </div>
            <button type="submit" class="btn" style="background: #43a047;">Reset Password</button>
        </form>
    </div>
</div>

<style>
    .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 40px;
        color: white;
        border: none;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
    }
</style>
{% endblock %}
