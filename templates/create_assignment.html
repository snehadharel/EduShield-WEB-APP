{% extends "base.html" %}

{% block title %}Create Assignment{% endblock %}

{% block content %}
<div style="width: 100%; max-width: 700px; margin: 0 auto;">
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 20px; padding: 25px; margin-bottom: 25px; color: white;">
        <h2>📝 Create Assignment</h2>
        <p>Add a new assignment for your course.</p>
    </div>
    <div style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Course</label>
                <select name="course_id" required class="form-control" style="width: 100%; padding: 12px; border-radius: 12px;">
                    {% for course in courses %}
                    <option value="{{ course.id }}">{{ course.course_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Title</label>
                <input type="text" name="title" required style="width: 100%; padding: 12px; border-radius: 12px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Description</label>
                <textarea name="description" rows="4" style="width: 100%; padding: 12px; border-radius: 12px;"></textarea>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Due Date</label>
                <input type="datetime-local" name="due_date" required style="width: 100%; padding: 12px; border-radius: 12px;">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Total Marks</label>
                <input type="number" name="total_marks" value="100" required style="width: 100%; padding: 12px; border-radius: 12px;">
            </div>
            <button type="submit" class="btn" style="background: #43a047;">Create Assignment</button>
        </form>
    </div>
</div>

<style>
    .btn {
        display: inline-block;
        padding: 10px 24px;
        border-radius: 40px;
        color: white;
        border: none;
        cursor: pointer;
    }
    .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
    }
</style>
{% endblock %}
