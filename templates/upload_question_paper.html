{% extends "base.html" %}

{% block title %}Upload Question Paper{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 20px; padding: 25px; margin-bottom: 25px; color: white;">
        <h2>📄 Upload Question Paper</h2>
        <p>Course: <strong>{{ exam.course_name }}</strong><br>Exam: <strong>{{ exam.title }}</strong></p>
    </div>

    <div style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: bold;">Question Paper (PDF only)</label>
                <input type="file" name="question_paper" accept=".pdf" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-top: 5px;">
                <small style="color: #666;">Only PDF files are allowed.</small>
            </div>

            <button type="submit" style="background: #43a047; color: white; border: none; padding: 12px 30px; border-radius: 40px; cursor: pointer; font-size: 16px;">
                📤 Upload Paper
            </button>
            <a href="{{ url_for('list_exams') }}" style="margin-left: 15px; color: #666; text-decoration: none;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
